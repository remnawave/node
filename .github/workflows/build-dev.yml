name: Build Dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:

env:
  REGISTRY_IMAGE: remnawave/node
  IMAGE_TAG: dev

jobs:
  send-tg-msg:
    name: Send TG message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: pending
          notify_fields: 'repo_with_tag,commit,workflow'
          title: 'Building docker images.'

  variants:
    name: Resolve variants
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.bake.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read variants from docker-bake.hcl
        id: bake
        run: |
          list=$(docker buildx bake --print 2>/dev/null | jq -c '.group.default.targets')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Variants: $list"

  build-docker-images:
    name: Build ${{ matrix.variant }} ${{ matrix.platform }}
    needs: [variants]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        variant: ${{ fromJson(needs.variants.outputs.list) }}
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        run: |
          docker buildx bake "${{ matrix.variant }}" \
            --set "*.platform=${{ matrix.platform }}" \
            --set "*.tags=" \
            --set "*.output=type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${{ runner.temp }}/metadata.json"

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest=$(jq -r '.["${{ matrix.variant }}"]["containerimage.digest"]' "${{ runner.temp }}/metadata.json")
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifest (${{ matrix.variant }})
    needs: [variants, build-docker-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags from docker-bake.hcl
        id: tags
        env:
          TAG: ${{ env.IMAGE_TAG }}
        run: |
          cd "$GITHUB_WORKSPACE"
          tags=$(docker buildx bake --print "${{ matrix.variant }}" 2>/dev/null \
            | jq -r --arg image "${{ env.REGISTRY_IMAGE }}:" '.target[].tags[] | select(startswith($image))')
          echo "Tags: $tags"
          echo "args=$(echo "$tags" | sed 's/^/-t /' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "first=$(echo "$tags" | head -1)" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.args }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.tags.outputs.first }}

  send-finish-tg-msg:
    name: Send TG message
    needs: [merge]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: ${{ job.status }}
          notify_fields: 'repo_with_tag,commit,workflow'
          title: 'Build Dev finished.'

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [build-docker-images, merge]
    if: failure()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send error notification
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: failure
          notify_fields: 'repo_with_tag,commit,workflow'
          title: 'Build Dev failed.'
