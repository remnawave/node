name: Build & Push Docker Image

on:
  push:
    tags:
      - '*'

jobs:
  send-start-deploy-telegram-message:
    name: Send Telegram message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            🏹 <b>Deploy</b> <code>${{ github.REPOSITORY }}@${{ github.ref_name }}</code> has started.

            ⏱️ <code>${{ github.event.head_commit.timestamp }}</code>

  variants:
    name: Resolve variants
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.bake.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read variants from docker-bake.hcl
        id: bake
        run: |
          list=$(docker buildx bake --print 2>/dev/null | jq -c '.group.default.targets')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Variants: $list"

  build-docker-images:
    name: Build ${{ matrix.variant }} ${{ matrix.platform }}
    needs: [variants]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        variant: ${{ fromJson(needs.variants.outputs.list) }}
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN_GH_DEPLOY }}

      - name: Build and push by digest
        run: |
          docker buildx bake "${{ matrix.variant }}" \
            --set "*.platform=${{ matrix.platform }}" \
            --set "*.tags=" \
            --set '*.output=type=image,"name=remnawave/node,ghcr.io/remnawave/node",push-by-digest=true,name-canonical=true,push=true' \
            --metadata-file "${{ runner.temp }}/metadata.json"

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest=$(jq -r '.["${{ matrix.variant }}"]["containerimage.digest"]' "${{ runner.temp }}/metadata.json")
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifests (${{ matrix.variant }})
    needs: [variants, build-docker-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN_GH_DEPLOY }}

      - name: Create & push manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Tags come from docker-bake.hcl, so a new variant needs no change here.
          resolve() {
            TAG="$1" docker buildx bake --file "$GITHUB_WORKSPACE/docker-bake.hcl" \
              --print "${{ matrix.variant }}" 2>/dev/null \
              | jq -r --arg reg "$2:" '.target[].tags[] | select(startswith($reg))'
          }

          for registry in remnawave/node ghcr.io/remnawave/node; do
            tags=$( { resolve latest "$registry"; resolve "${{ github.ref_name }}" "$registry"; } \
              | sed 's/^/-t /' | tr '\n' ' ')

            echo "→ $registry: $tags"

            docker buildx imagetools create $tags \
              $(for digest in *; do echo "$registry@sha256:$digest"; done)
          done

      - name: Inspect image
        run: docker buildx imagetools inspect $(TAG=${{ github.ref_name }} docker buildx bake --print "${{ matrix.variant }}" 2>/dev/null | jq -r '.target[].tags[0]')

  create-release:
    needs: [merge]
    runs-on: ubuntu-latest
    steps:
      - name: NewTag
        id: tag
        uses: JinoArch/get-latest-tag@latest

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GH_DEPLOY }}
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          make_latest: true
          draft: false
          prerelease: false
          body: |
            🚀 Autogenerated release v${{ github.ref_name }}

            📝 Compare changes: [${{ steps.tag.outputs.previousTag }}...${{ steps.tag.outputs.latestTag }}](https://github.com/${{ github.repository }}/compare/${{ steps.tag.outputs.previousTag }}...${{ steps.tag.outputs.latestTag }})

            Latest Docker image:
            - `remnawave/node:latest`
            - `ghcr.io/remnawave/node:latest`

            Docker images:
            - `remnawave/node:${{github.ref_name}}`
            - `ghcr.io/remnawave/node:${{github.ref_name}}`

            Docker images with bundled HAProxy:
            - `remnawave/node:latest-hp` / `remnawave/node:${{github.ref_name}}-hp`
            - `ghcr.io/remnawave/node:latest-hp` / `ghcr.io/remnawave/node:${{github.ref_name}}-hp`

  send-telegram-message:
    name: Send Telegram message
    needs: [merge, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            ✅ <b>Deploy</b> <code>${{ github.REPOSITORY }}@${{ github.ref_name }}</code> has finished.

            image tag: <code>${{ github.sha }}</code>

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [build-docker-images, merge]
    if: failure()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Send error notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ ${{ github.REPOSITORY }}@${{ github.ref_name }} build failed
